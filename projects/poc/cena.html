<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root { --bg:#0b1220; --fg:#f4f1ea; --acc:#ffb703; --mut:#8b97ad; }
  * { box-sizing:border-box; margin:0 }
  html,body { width:100%; height:100%; background:var(--bg); color:var(--fg);
    font-family:'Inter','Inter Display',system-ui,sans-serif; overflow:hidden }
  /* unidade vmin: a mesma cena escala em 9:16 e 16:9 */
  .stage { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3vmin; padding:6vmin }
  /* safe zones do Reels: topo/base livres de UI */
  body[data-format="9x16"] .stage { padding:14vh 6vw 22vh }
  .rotulo { font-size:4.2vmin; letter-spacing:.3vmin; text-transform:uppercase; color:var(--mut); opacity:0 }
  .valor { font-size:12vmin; font-weight:800; color:var(--acc); font-variant-numeric:tabular-nums; opacity:0 }
  .barra { width:60vmin; height:1vmin; background:#1c2740; border-radius:1vmin; overflow:hidden }
  .barra i { display:block; height:100%; width:0; background:var(--acc) }
  .legenda { position:absolute; left:6vw; right:6vw; text-align:center; font-size:4vmin; font-weight:700; line-height:1.3 }
  body[data-format="9x16"] .legenda { bottom:24vh }
  body[data-format="16x9"] .legenda { bottom:8vh }
  .cap-word { color:#5b6882; transition:none } .cap-word.on { color:var(--fg) } .cap-word.done { color:#aab4c8 }
</style></head>
<body>
<div class="stage">
  <div class="rotulo" id="rot"></div>
  <div class="valor" id="val">R$ 0</div>
  <div class="barra"><i id="bar"></i></div>
</div>
<div class="legenda" id="cap"></div>
<script src="../../core/vendor/gsap.min.js"></script>
<script src="../../core/motion/captions.js"></script>
<script>
  const fmt = new URLSearchParams(location.search).get('format') || '9x16';
  document.body.dataset.format = fmt;
  const P = { rotulo:'Faturamento do mês', de:0, ate:1250000 }; // vem do storyboard (params)
  document.getElementById('rot').textContent = P.rotulo;
  const brl = new Intl.NumberFormat('pt-BR', { style:'currency', currency:'BRL', maximumFractionDigits:0 });
  const obj = { v:P.de }, val = document.getElementById('val');
  const tl = gsap.timeline({ paused:true });
  tl.to('#rot', { opacity:1, y:0, duration:.6, ease:'power2.out' }, .2)
    .to('#val', { opacity:1, duration:.4 }, .4)
    .to(obj, { v:P.ate, duration:3.6, ease:'power3.out', onUpdate(){ val.textContent = brl.format(Math.round(obj.v)) } }, .6)
    .to('#bar', { width:'100%', duration:3.6, ease:'power3.out' }, .6);
  const caps = buildCaptions(document.getElementById('cap'), gsap);
  window.__seek = t => { tl.time(t); caps.time(t); };
  window.__seek(0);
</script></body></html>
